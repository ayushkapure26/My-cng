name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Create test signing key
        run: keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Check dashboard and render previews
        run: gradle :app:testDebugUnitTest --tests com.example.DriveDashboardScreenshotTest -Droborazzi.test.record=true --no-configuration-cache --stacktrace
      - name: Report screenshot test failures
        if: failure()
        run: cat app/build/test-results/testDebugUnitTest/*.xml || true
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: CNG-Mitra-UI-Preview
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/ui-preview/*.png
          if-no-files-found: error
          retention-days: 7
